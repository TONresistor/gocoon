name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: android
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build static binaries
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=$(git describe --tags --always)
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w \
            -X 'github.com/TONresistor/gocoon/pkg/cocoon.Version=${VERSION}' \
            -X 'github.com/TONresistor/gocoon/pkg/cocoon.Commit=${COMMIT}' \
            -X 'github.com/TONresistor/gocoon/pkg/cocoon.BuildDate=${DATE}'"
          mkdir -p out
          for cmd in gocoon gocoon-runner; do
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            go build -trimpath -ldflags="$LDFLAGS" -o "out/${cmd}${ext}" "./cmd/${cmd}"
          done
          cp README.md LICENSE NOTICE out/
          archive="gocoon-${VERSION}-${GOOS}-${GOARCH}"
          tar -C out -czf "${archive}.tar.gz" .
          sha256sum "${archive}.tar.gz" > "${archive}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: gocoon-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            gocoon-*.tar.gz
            gocoon-*.tar.gz.sha256
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: collect
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          (cd release && sha256sum *.tar.gz > SHA256SUMS.txt)
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
