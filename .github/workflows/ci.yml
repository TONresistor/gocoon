name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/_test.yml

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
          - os: windows
            arch: amd64
          - os: windows
            arch: arm64
          - os: android
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist/${{ matrix.os }}/${{ matrix.arch }}
          ext=""
          if [ "${GOOS}" = "windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.os }}/${{ matrix.arch }}/gocoon${ext}" ./cmd/gocoon
          go build -trimpath -ldflags="-s -w" -o "dist/${{ matrix.os }}/${{ matrix.arch }}/gocoon-runner${ext}" ./cmd/gocoon-runner
      - uses: actions/upload-artifact@v4
        with:
          name: gocoon-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/${{ matrix.os }}/${{ matrix.arch }}/
          if-no-files-found: error

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

  notify:
    needs: [test, build, lint]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '-1003525458001'
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Telegram bot token not configured, skipping"
            exit 0
          fi

          if [ "$TEST_RESULT" = "success" ] && [ "$BUILD_RESULT" = "success" ] && [ "$LINT_RESULT" = "success" ]; then
            STATUS=success
          else
            STATUS=failure
          fi

          send() {
            local sha=$1 title body short url TEXT
            title=$(git log -1 --pretty=format:'%s' "$sha")
            body=$(git log -1 --pretty=format:'%b' "$sha" | head -20)
            short=$(git rev-parse --short "$sha")
            url="${{ github.server_url }}/${{ github.repository }}/commit/$sha"
            TEXT="<b>[Gocoon] $title</b>"
            [ -n "$body" ] && printf -v TEXT '%s\n\n%s' "$TEXT" "$body"
            printf -v TEXT '%s\n\n<a href="%s">View commit %s</a>' "$TEXT" "$url" "$short"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d disable_web_page_preview="true" \
              -d text="$TEXT"
          }

          # CI failed/cancelled: single fallback notif on HEAD
          if [ "$STATUS" != "success" ]; then
            send "$AFTER_SHA"
            exit 0
          fi

          # CI succeeded: notify per commit in the pushed range (max 20)
          NULL_SHA="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$NULL_SHA" ] || ! git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null; then
            COMMITS=$(git log --reverse --pretty=format:'%H' --max-count=20 "$AFTER_SHA")
          else
            COMMITS=$(git log --reverse --pretty=format:'%H' "$BEFORE_SHA..$AFTER_SHA")
          fi

          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            send "$sha"
            sleep 1
          done <<< "$COMMITS"
